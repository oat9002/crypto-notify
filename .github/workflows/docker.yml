name: docker

on:
  workflow_dispatch:
    inputs:
      snapshot_build:
        description: 'Keep the -SNAPSHOT version and do not publish the latest tag'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      snapshot_build:
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        description: 'docker username'
        required: true
      DOCKERHUB_TOKEN:
        description: 'docker token'
        required: true

jobs:
  dockerPublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: sbt
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Get current app version
        id: get-app-version
        run: |
          VERSION=$(cat version.sbt | cut -d '"' -f2)
          if [[ "${{ inputs.snapshot_build }}" != "true" ]]; then
            VERSION="${VERSION%-SNAPSHOT}"
          fi
          echo "version: $VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: sbt/setup-sbt@v1
      - name: Create Dockerfile
        run: sbt "Docker / stage"
      - name: Publish to Docker Hub
        run: |
          cd ./target/docker/stage
          TAGS=(--tag "oat9002/crypto-notify:${{ steps.get-app-version.outputs.APP_VERSION }}")
          if [[ "${{ inputs.snapshot_build }}" != "true" ]]; then
            TAGS+=(--tag "oat9002/crypto-notify:latest")
          fi
          docker buildx build --platform="linux/amd64,linux/arm64" "${TAGS[@]}" --push .
